# ── Йои — docker-compose.yml ────────────────────────────────────────
# Быстрый старт: docker compose up -d
# Прокси уже должен быть запущен локально на хосте
# =====================================================================

services:
  yoi:
    build: .
    container_name: yoi-agent
    restart: unless-stopped
    env_file:
      - ./profile/.env
    environment:
      - HERMES_PROFILE=yoi
      - HERMES_HOME=/root/.hermes/profiles/yoi
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - yoi-data:/root/.hermes/profiles/yoi/sessions
      - yoi-memories:/root/.hermes/profiles/yoi/memories
      - yoi-skills:/root/.hermes/profiles/yoi/skills
      - yoi-logs:/root/.hermes/profiles/yoi/logs
      - yoi-cache:/root/.hermes/profiles/yoi/cache
      - yoi-audio:/root/.hermes/profiles/yoi/audio_cache

volumes:
  yoi-data:
  yoi-memories:
  yoi-skills:
  yoi-logs:
  yoi-cache:
  yoi-audio: